    <noscript>
      <h1>Ratio·9 — a guitar speed trainer built on subdivision ratios</h1>
      <p>
        Ratio·9 needs JavaScript, because the click is scheduled in the Web Audio
        graph in your browser. Here is what it does.
      </p>
      <p>
        Set the click to 100 BPM. Play two bars of eighth-note triplets, three
        notes per beat, then two bars of sextuplets, six notes per beat, without
        touching the click. The pulse never moved and your picking hand just
        doubled its speed. That ratio, not the tempo dial, is what builds speed:
        you reach the fast motion immediately, against a beat that stays put, so
        any drift is audible against a reference that did not shift.
      </p>
      <h2>Three modes</h2>
      <ul>
        <li>
          <strong>Ratios</strong> — two loops, two subdivisions, one fixed BPM,
          with configurable bars per loop, rest beats between them and a count-in.
        </li>
        <li>
          <strong>Speed</strong> — progressive tempo. The BPM ramps after N bars
          along a linear, logarithmic, stepback or pyramid curve.
        </li>
        <li>
          <strong>Metronome</strong> — a straight click: 8 subdivisions, 7 time
          signatures, configurable accent grouping.
        </li>
      </ul>
      <h2>Everything else</h2>
      <ul>
        <li>Nine click sounds, synthesized at click time, with separate volume for accents, beats and subdivisions.</li>
        <li>Saved presets, tap tempo, a countdown practice timer and keyboard shortcuts.</li>
        <li>An in-app field manual explaining the method.</li>
        <li>Installable as a PWA, works offline, no account, no tracking, no backend.</li>
        <li>Free and open source under the MIT license.</li>
      </ul>
      <p>
